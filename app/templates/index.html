<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mini Server Dashboard</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="wrap">
    <header class="header">
      <div>
        <div class="eyebrow">LINUX SERVER</div>
        <h1>Mini Server Dashboard</h1>
        <div class="muted" id="host">{{ hostname }}</div>
      </div>
      <div class="status">
        <span class="dot"></span> Online
      </div>
    </header>

    <section class="grid">
      <article class="card">
        <div class="label">CPU</div>
        <div class="value" id="cpu">—</div>
        <div class="sub" id="cpu-count">—</div>
        <div class="bar"><span id="cpu-bar"></span></div>
      </article>

      <article class="card">
        <div class="label">MEMORY</div>
        <div class="value" id="memory">—</div>
        <div class="sub" id="memory-detail">—</div>
        <div class="bar"><span id="memory-bar"></span></div>
      </article>

      <article class="card">
        <div class="label">DISK /</div>
        <div class="value" id="disk">—</div>
        <div class="sub" id="disk-detail">—</div>
        <div class="bar"><span id="disk-bar"></span></div>
      </article>

      <article class="card">
        <div class="label">UPTIME</div>
        <div class="value small" id="uptime">—</div>
        <div class="sub" id="load">Load: —</div>
      </article>
    </section>

    <section class="card docker-card">
      <div class="section-head">
        <div>
          <div class="label">DOCKER CONTAINERS</div>
          <div class="muted" id="docker-status">Checking Docker…</div>
        </div>
      </div>
      <div id="containers" class="containers"></div>
    </section>

    <footer>
      Auto refresh: 2s · <a href="/docs">API docs</a> · <a href="/health">Health</a>
    </footer>
  </main>

<script>
async function refresh() {
  const res = await fetch('/api/metrics', {cache: 'no-store'});
  const d = await res.json();

  document.getElementById('host').textContent = d.hostname;
  document.getElementById('cpu').textContent = d.cpu_percent.toFixed(1) + '%';
  document.getElementById('cpu-count').textContent = d.cpu_count + ' logical CPUs';
  document.getElementById('cpu-bar').style.width = d.cpu_percent + '%';

  document.getElementById('memory').textContent = d.memory_percent.toFixed(1) + '%';
  document.getElementById('memory-detail').textContent =
    `${d.memory_used_gb} / ${d.memory_total_gb} GB`;
  document.getElementById('memory-bar').style.width = d.memory_percent + '%';

  document.getElementById('disk').textContent = d.disk_percent.toFixed(1) + '%';
  document.getElementById('disk-detail').textContent =
    `${d.disk_used_gb} / ${d.disk_total_gb} GB`;
  document.getElementById('disk-bar').style.width = d.disk_percent + '%';

  document.getElementById('uptime').textContent = d.uptime;
  document.getElementById('load').textContent =
    `Load: ${d.load_1m} / ${d.load_5m} / ${d.load_15m}`;

  const dockerStatus = document.getElementById('docker-status');
  const containers = document.getElementById('containers');

  if (!d.docker.available) {
    dockerStatus.textContent = 'Docker unavailable or permission denied';
    containers.innerHTML = '<div class="empty">No Docker data</div>';
    return;
  }

  dockerStatus.textContent = `${d.docker.containers.length} container(s)`;
  if (!d.docker.containers.length) {
    containers.innerHTML = '<div class="empty">No containers</div>';
    return;
  }

  containers.innerHTML = d.docker.containers.map(c => `
    <div class="container-row">
      <div>
        <strong>${escapeHtml(c.name)}</strong>
        <div class="muted">${escapeHtml(c.image)}</div>
      </div>
      <span class="badge ${c.status === 'running' ? 'ok' : 'down'}">${escapeHtml(c.status)}</span>
    </div>
  `).join('');
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>
